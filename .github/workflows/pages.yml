name: Deploy to GitHub Pages

on:
  # 站点已下线（GitHub Pages 已 unpublish），push 不再自动部署。
  # 想重新上线：Settings -> Pages 先发布一次，再在这里手动点 Run workflow。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 整理发布目录
        run: |
          mkdir -p _site
          cp index.html admin.html styles.css app.js config.js _site/
          cp -r assets _site/ 2>/dev/null || true
          # 不把 supabase/、README、workflow 发到站点上
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
